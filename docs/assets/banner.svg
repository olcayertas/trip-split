<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="TripSplit: split the bill, not the friendship">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#006a65"/>
      <stop offset="1" stop-color="#00504c"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fbf9"/>
      <stop offset="1" stop-color="#9df1eb"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="32" fill="url(#bg)"/>

  <!-- dotted flight path -->
  <path d="M60 330 C 320 345, 600 330, 780 300 S 1040 140, 1130 60" fill="none" stroke="#9df1eb" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.7"/>
  <!-- plane -->
  <g transform="translate(1110 52) rotate(-25)">
    <path d="M0 0 L-46 -8 L-40 0 L-46 8 Z" fill="#f4fbf9"/>
    <path d="M-22 0 L-34 -22 L-26 -22 L-10 0 L-26 22 L-34 22 Z" fill="#f4fbf9"/>
  </g>

  <!-- title -->
  <text x="90" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" fill="#f4fbf9" letter-spacing="-2">TripSplit</text>
  <text x="94" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="500" fill="#9df1eb">Split the bill. Not the friendship.</text>
  <text x="94" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#d0e4ff">Offline · No account · Encrypted relay (optional) · iPhone + Android</text>

  <!-- receipt card -->
  <g transform="translate(830 150) rotate(6)">
    <rect x="0" y="0" width="230" height="150" rx="20" fill="url(#card)"/>
    <text x="22" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#00504c">Balloon ride</text>
    <text x="22" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#006a65">320.00 EUR</text>
    <rect x="22" y="92" width="186" height="6" rx="3" fill="#006a65" opacity="0.18"/>
    <rect x="22" y="92" width="46" height="6" rx="3" fill="#006a65"/>
    <text x="22" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#00504c">÷ 4 friends = 80.00 each</text>
  </g>
</svg>
