name: Release Android

# Manual only. The keystore stays on the owner's Mac, so this workflow checks the build
# without a release signature. Use scripts/release-android.sh for the real signed APK.
on:
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          build-root-directory: android
      - name: Build the unsigned release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: tripsplit-release-unsigned
          path: android/app/build/outputs/apk/release/*.apk
