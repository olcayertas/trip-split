name: Android

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "android/**"
      - "protocol/vectors/**"
      - ".github/workflows/android.yml"

jobs:
  app:
    name: Android app (unit tests and debug build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # The runner image has the Android SDK. Accept its licences for the platform that :app needs.
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain
        working-directory: android
