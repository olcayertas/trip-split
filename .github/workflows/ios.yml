name: iOS

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apple/**"
      - "protocol/**"
      - ".github/workflows/ios.yml"

jobs:
  store:
    name: Swift store (GRDB)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: apple/Store

  net:
    name: Swift net (LAN transport)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: apple/Net

  app:
    name: App build (simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: apple
      - run: >
          xcodebuild build
          -project TripSplit.xcodeproj
          -scheme TripSplit
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
        working-directory: apple
